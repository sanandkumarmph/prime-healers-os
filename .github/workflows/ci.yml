name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - uat
      - 'codex/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Check locked dependencies for security advisories
        run: |
          composer audit --locked
          npm audit --audit-level=moderate

      - name: Test private UAT mail setup safety offline
        run: python3 -B -m unittest discover -s ops/phos-access-security-uat -p 'test_*.py'

      - name: Build frontend assets
        run: npm run build

      - name: Test dashboard browser navigation
        run: node --test tests/Browser/*Test.cjs

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Clear caches
        run: |
          php artisan config:clear
          php artisan route:clear

      - name: Cache Blade views
        run: php artisan view:cache

      - name: Run complete test suite
        run: vendor/bin/pest --do-not-cache-result
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
