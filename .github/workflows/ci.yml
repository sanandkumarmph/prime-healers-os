name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - uat
      - 'codex/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # reviewed v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # reviewed v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Test password recovery mail setup offline
        run: python3 -B -m unittest discover -s ops/phos-password-recovery-uat -p 'test_setup_zoho_mail.py'

      - name: Test safe Zoho setup failure categories offline
        run: python3 -I -B -m unittest discover -s ops/phos-password-recovery-uat -p 'test_zoho_diagnostics.py' -v

      - name: Test hidden Zoho prompts on a real Linux terminal
        run: python3 -I -B -m unittest discover -s ops/phos-password-recovery-uat -p 'test_zoho_terminal.py' -v

      - name: Test password release and recovery in disposable Linux fixtures
        run: sudo python3 -I -B -m unittest discover -s ops/phos-password-recovery-uat -p 'test_*coordinator.py' -v

      - name: Test password package and rollback guards offline
        run: sudo python3 -I -B -m unittest discover -s ops/phos-password-recovery-uat -p 'test_deploy.py' -v

      - name: Test password visibility package and source-only recovery offline
        run: python3 -I -B -m unittest discover -s ops/phos-password-visibility-uat -p 'test_deploy.py' -v

      - name: Test role-access package and recovery offline
        run: sudo python3 -I -B -m unittest discover -s ops/phos-role-access-uat -p 'test_deploy.py' -v

      - name: Test role-access activation and recovery in disposable Linux fixtures
        run: sudo python3 -I -B -m unittest discover -s ops/phos-role-access-uat -p 'test_linux_coordinator.py' -v

      - name: Install npm dependencies
        run: npm ci

      - name: Check locked dependencies for security advisories
        run: |
          composer audit --locked
          npm audit --audit-level=moderate

      - name: Test private UAT mail setup safety offline
        run: python3 -B -m unittest discover -s ops/phos-access-security-uat -p 'test_*.py'

      - name: Test deployment coordinator in disposable Linux ownership fixtures
        run: sudo python3 -I -B -m unittest discover -s ops/phos-access-security-uat/dependency -p 'test_linux_coordinator.py' -v

      - name: Build frontend assets
        run: npm run build

      - name: Test dashboard browser navigation
        run: node --test tests/Browser/*Test.cjs

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Clear caches
        run: |
          php artisan config:clear
          php artisan route:clear

      - name: Cache Blade views
        run: php artisan view:cache

      - name: Run complete test suite
        run: vendor/bin/pest --do-not-cache-result
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

      - name: Setup patched PHOS PDF Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Verify PDF compatibility on the patched Node 22 runtime
        run: node --test tests/Browser/PdfRuntimeTest.cjs
